<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IHMIS Aggregation</title>

    <!-- DHIS2 styles -->
    <!--<link rel="stylesheet" href="../dhis-web-commons/css/dhis2.css">-->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">
    <h2>IHMIS Aggregation Job</h2>

    <button id="runBtn" class="btn btn-primary">
        Run Aggregation
    </button>

    <button id="refreshBtn" class="btn btn-default">
        Refresh Status
    </button>

    <hr>

    <h3>Status</h3>
    <pre id="statusBox">Loading...</pre>

    <hr>
	
	<!--
    <h3>Logs</h3>
    <div id="logs" class="logs"></div>
	-->
	<h3>Logs</h3>

	<button id="downloadLogBtn" class="btn btn-default">
		Download Latest Log
	</button>
	
	<div id="logs" class="logs"></div>
	
	<select id="logSelect"></select>
	<button onclick="downloadSelectedLog()">Download Selected</button>

	<button onclick="cleanupLogs()">Delete Old Logs</button>
	
	<script src="app.js"></script>
</div>


</body>
</html>
